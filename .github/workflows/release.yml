name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag must have the form v1.2.3"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Apply tag version to build metadata
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('wails.json','utf8'));p.info.productVersion=process.env.RELEASE_VERSION;fs.writeFileSync('wails.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run quality gates
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location frontend
          npx tsc --noEmit
          npm test
          npm run build
          Pop-Location
          go vet ./...
          go test ./...

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Wails" }

          $candidates = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")
          $nsis = $candidates |
            Where-Object { Test-Path (Join-Path $_ "makensis.exe") } |
            Select-Object -First 1
          for ($attempt = 1; !$nsis -and $attempt -le 3; $attempt++) {
            choco install nsis --no-progress -y
            $exitCode = $LASTEXITCODE
            $nsis = $candidates |
              Where-Object { Test-Path (Join-Path $_ "makensis.exe") } |
              Select-Object -First 1
            if (!$nsis -and $attempt -lt 3) {
              Write-Warning "NSIS install attempt $attempt failed (exit $exitCode); retrying"
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (!$nsis) { throw "NSIS installation failed after 3 attempts" }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CGO_ENABLED = "0"
          wails build -platform windows/amd64 -nsis -installscope user -trimpath -ldflags "-s -w -X qiaoji/internal/config.AppVersion=$env:RELEASE_VERSION"

      - name: Create checksum
        shell: pwsh
        run: |
          $asset = "build/bin/Qiaoji-$env:RELEASE_VERSION-windows-amd64-setup.exe"
          if (!(Test-Path $asset)) { throw "Installer not found: $asset" }
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $asset -Leaf)" | Set-Content -Encoding ascii "build/bin/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/Qiaoji-${{ steps.version.outputs.version }}-windows-amd64-setup.exe
            build/bin/SHA256SUMS.txt
